name: publish
on:
  push:
    tags: ['v0.2.0', 'v0.2.0-next.*']
permissions:
  contents: read
concurrency:
  group: projection-npm-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.0
          cache: npm
      - run: npm ci
      - run: node scripts/verify-release.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run tokens:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run build
      - run: npm run build:docs
      - run: npm run test:storybook
      - run: npm run test:docs
      - run: npm run test:artifact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release
          path: release-artifacts/hannasage-projection-ui-*.tgz
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.0
      - run: npm install --global npm@11.6.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release
          path: release
      - run: node scripts/verify-release.mjs --publish
