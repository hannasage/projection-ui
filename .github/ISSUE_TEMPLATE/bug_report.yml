name: Bug report
description: Report a reproducible component, theme, or package problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Use sample data. Do not post credentials or private data. For security concerns, read SECURITY.md."
  - type: textarea
    id: environment
    attributes:
      label: Versions and environment
      description: Include Projection UI, React, browser, operating system, and build tool versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Add the smallest public example and the steps to repeat the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include relevant errors or screenshots with private details removed.
    validations:
      required: true
