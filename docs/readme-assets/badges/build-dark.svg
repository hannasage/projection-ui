<svg xmlns="http://www.w3.org/2000/svg" width="176" height="28" viewBox="0 0 176 28" role="img" aria-labelledby="title">
  <title id="title">Open the current build status on GitHub Actions</title>
  <defs>
    <linearGradient id="accent"><stop stop-color="#C9F53A"/><stop offset="1" stop-color="#A1F55B"/></linearGradient>
    <clipPath id="shape"><rect x=".5" y=".5" width="175" height="27" rx="6"/></clipPath>
  </defs>
  <g clip-path="url(#shape)">
    <rect width="176" height="28" fill="#0D1117"/>
    <rect x="58" width="118" height="28" fill="url(#accent)" fill-opacity=".09"/>
    <path d="M58 0v28" stroke="#1B2535"/>
    <path d="M66 27h102" stroke="url(#accent)" stroke-width="1.5"/>
  </g>
  <rect x=".5" y=".5" width="175" height="27" rx="6" fill="none" stroke="#1B2535"/>
  <g font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">
    <text x="29.0" y="18" fill="#8396AB">Build</text>
    <text x="117.0" y="18" fill="#DDE3EE">GitHub Actions</text>
  </g>
</svg>
